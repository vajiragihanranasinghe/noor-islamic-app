# ===== NOOR ISLAMIC APP — LOW-RAM GRADLE CONFIG =====
# Optimized for Termux on 2.5 GB RAM Android phone

# JVM memory for Gradle daemon
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# Disable daemon (saves RAM between builds)
org.gradle.daemon=false

# Single-threaded build (safer on low RAM)
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.configureondemand=false

# Caching
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Kotlin (unused but harmless)
kotlin.daemon.jvmargs=-Xmx512m
